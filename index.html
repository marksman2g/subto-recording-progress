<!DOCTYPE html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SubTo recording progress</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f3;color:#203528;font:17px/1.45 system-ui,sans-serif}main{max-width:56rem;margin:auto;padding:clamp(1rem,4vw,3rem)}h1{font-size:clamp(1.8rem,5vw,3rem);margin:0}h2{font-size:1.25rem;margin:0 0 .6rem}section{background:white;border:1px solid #d7ded6;border-radius:.8rem;margin:1rem 0;padding:1rem 1.25rem}p{margin:.35rem 0}progress{width:100%;height:1.2rem;accent-color:#287748}strong{font-size:1.65rem}li{margin:.4rem 0;overflow-wrap:anywhere}ul{padding-left:1.3rem}small,time{color:#4b6152}summary{cursor:pointer;font-weight:650}#error{color:#8d351b}
</style><main><h1>SubTo recording progress</h1><p id="stamp">Loading Animal’s latest report…</p><p id="error" role="status"></p>
<section><h2>Library</h2><strong id="main"></strong><progress id="bar" value="0" max="100"></progress><p id="left"></p><p id="review"></p></section>
<section><h2>Current lesson</h2><p id="lesson"></p><p id="play"></p></section>
<section><h2>Library groups</h2><ul id="groups"></ul></section>
<section><h2>Incoming videos</h2><p><small>New deliveries appear here. Each lesson counts once when accepted into the recording tracker.</small></p><ul id="incoming"></ul></section>
<section><details open><summary>Recording files</summary><ul id="files"></ul></details></section></main>
<script>
const at=id=>document.getElementById(id);
const pct=(n,d)=>d?(100*n/d).toFixed(1)+'%':'—';
function list(id,rows){at(id).replaceChildren(...rows.map(s=>{const e=document.createElement('li');e.textContent=s;return e}))}
function paint(s){
 const n=s.recorded,t=s.total;
 at('main').textContent=pct(n,t)+' recorded';at('bar').value=n;at('bar').max=t;
 at('left').textContent=n+' of '+t+' mapped lessons recorded · '+(t-n)+' remaining ('+pct(t-n,t)+')';
 at('review').textContent=s.verified+' verified · '+(n-s.verified)+' awaiting review';
 at('stamp').textContent='Animal last reported '+new Date(s.at).toLocaleString();
 at('lesson').textContent=s.lesson;at('play').textContent=s.play;
 list('groups',s.groups);list('incoming',s.incoming.length?s.incoming:['No incoming videos detected.']);list('files',s.files);
}
async function refresh(){try{
 const r=await fetch('https://raw.githubusercontent.com/marksman2g/subto-recording-progress/live/status.json?t='+Math.floor(Date.now()/60000),{cache:'no-store'});
 if(!r.ok)throw Error(r.status);const s=await r.json();paint(s);at('error').textContent=Date.now()-Date.parse(s.at)>7*60000?'The latest report is more than seven minutes old.':'';
 try{localStorage.setItem('lastSubTo',JSON.stringify(s))}catch{}
}catch{at('error').textContent='Could not refresh from Animal. Check the last report time.'}}
try{const prev=JSON.parse(localStorage.getItem('lastSubTo'));if(prev)paint(prev)}catch{}
refresh();setInterval(refresh,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script></html>
